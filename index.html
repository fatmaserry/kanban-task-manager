<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kanban Board | Task Manager</title>
    <meta
      name="description"
      content="A Kanban task manager. Tasks are saved in localStorage."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="css/style.css" />
    <script type="module" src="dist/main.js"></script>
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <i class="fa-solid fa-table-columns" aria-hidden="true"></i>
          <h1>Kanban</h1>
        </div>
        <button
          id="add-task-btn"
          class="add-btn"
          type="button"
          aria-label="Add task"
          title="Add task"
        >
          <i class="fa-solid fa-plus" aria-hidden="true"></i>
        </button>
      </div>
    </header>

    <main class="main">
      <div id="board" class="board" aria-label="Kanban board"></div>
    </main>

    <footer class="footer">
      <p>
        <i class="fa-regular fa-copyright" aria-label="Copyright"></i>
        <span id="year">2026</span>
      </p>
    </footer>

    <!-- Create / Edit task dialog -->
    <dialog id="task-dialog" class="dialog" aria-labelledby="dialog-title">
      <div class="dialog-head">
        <h2 id="dialog-title">Create New Task</h2>
        <button
          id="close-dialog-btn"
          class="close-btn"
          type="button"
          aria-label="Close"
        >
          <i class="fa-solid fa-xmark" aria-hidden="true"></i>
        </button>
      </div>

      <form id="task-form" class="dialog-body" novalidate>
        <div class="field">
          <label for="task-title"
            ><i class="fa-solid fa-heading"></i> Task Title
            <span class="req">*</span></label
          >
          <input
            id="task-title"
            type="text"
            maxlength="100"
            placeholder="What needs to be done?"
            autocomplete="off"
          />
          <p id="title-error" class="error" hidden></p>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="task-priority"
              ><i class="fa-solid fa-flag"></i> Priority</label
            >
            <select id="task-priority">
              <option value="low">Low</option>
              <option value="medium" selected>Medium</option>
              <option value="high">High</option>
            </select>
          </div>
          <div class="field">
            <label for="task-due"
              ><i class="fa-regular fa-calendar"></i> Due Date</label
            >
            <input id="task-due" type="date" />
          </div>
        </div>

        <div class="field">
          <label for="task-desc"
            ><i class="fa-solid fa-align-left"></i> Description</label
          >
          <textarea
            id="task-desc"
            rows="3"
            maxlength="500"
            placeholder="Add more details about this task..."
          ></textarea>
          <p id="desc-counter" class="counter">0/500</p>
        </div>

        <div class="dialog-actions">
          <button id="cancel-btn" class="btn btn-secondary" type="button">
            Cancel
          </button>
          <button id="submit-btn" class="btn btn-primary" type="submit">
            <i id="submit-icon" class="fa-solid fa-plus" aria-hidden="true"></i>
            <span id="submit-text">Add Task</span>
          </button>
        </div>
      </form>
    </dialog>

    <!-- Delete confirmation dialog -->
    <dialog
      id="confirm-dialog"
      class="dialog dialog-sm"
      aria-labelledby="confirm-title"
    >
      <div class="dialog-body confirm">
        <div class="confirm-icon">
          <i class="fa-solid fa-trash-can" aria-hidden="true"></i>
        </div>
        <h2 id="confirm-title">Delete task?</h2>
        <p id="confirm-text"></p>
        <div class="dialog-actions">
          <button id="confirm-no" class="btn btn-secondary" type="button">
            Cancel
          </button>
          <button id="confirm-yes" class="btn btn-danger" type="button">
            Delete
          </button>
        </div>
      </div>
    </dialog>
  </body>
</html>
